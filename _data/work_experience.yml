- company: NASA Marshall Space Flight Center
  position: ECLSS Intern
  duration: June, 2025 &mdash; August 2025
  summary: I completed a MATLAB library that processes on-orbit data for one of the International Space Station’s Life Support (ECLSS) systems and produces performance and operational data. Python is used to process the large data files into graphs for the team’s periodic analysis of the system. Moving the library from VBA to MATLAB & Python allowed the team to poll the data at one-second intervals to allow for much higher data fidelity and reduce the time to complete the data analysis from hours to seconds. After completing the MATLAB & Python library, I completed weekly literature reviews for key aspects of historical ECLSS systems to produce concise summaries to assist with future system development. 

