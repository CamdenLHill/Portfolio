# Site settings
title: "Camden Hill's Resume and Porfolio"
description: "This serves as my personal website and contains my full volume of work."

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Camden L. Hill"
resume_title:                   "Aerospace & Mechanical Engineer"

# used for the contact button in _layouts/resume.html
resume_contact_email:           "hillarious2103@outlook.com"

# the next two items are used for schema itemprops in _layouts/resume.html
resume_contact_telephone:       "346-334-2229"
resume_contact_address:         "2103 Noblewood Ct., League City"

resume_header_contact_info:     "2103 Noblewood Ct., League City • 346-334-2229 • hillarious2103@outlook.com"
display_header_contact_info:    "false"

resume_header_intro: "<p>I graduated from Texas A&M University in 2025 & began my Masters of Science in Mechanical Engineering in the Fall. I've interned at three aerospace organizations focusing primarily on software development for testing applications, and, secondarily, on stress analysis and design. I've completed my lunar lander capstone project, designed multiple rocket engine injectors and nozzles, and finished many other projects.</p>"

# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
# to leave blank
resume_looking_for_work:        "yes"

# Decide which sections to use
